<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>THICC 🍑</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* (All the same beautiful glass styles) */
    :root {
      --header-height: 68px;
      --bg: #0a0a0b;
      --glass-bg: rgba(28, 28, 30, 0.7);
      --glass-bg2: rgba(44, 44, 46, 0.5);
      --text: #ffffff;
      --text2: #aeaeb2;
      --accent: #34c759;
      --accent2: #ff375f;
      --radius: 24px;
      --font: 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif;

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);

  </style>
</head>
<body>
  <!-- LOGIN SCREEN -->

    <div class="login-card">
      <div class="login-peach">🍑</div>
      <div class="login-logo">THICC</div>
      <div class="login-subtitle">Your daily thiccness, synced</div>
      <input type="email" id="loginEmail" class="email-input" placeholder="you@email.com" autofocus />
      <button id="sendMagicLinkBtn" class="magic-btn">Send Magic Link</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div class="app" id="mainApp">
    <!-- ... all the existing cards, checklist, water, meals, exercise ... -->
    <!-- Same as before, no need to change HTML structure -->
  </div>

  <script>
    (function() {
      const SUPABASE_URL = 'https://uwqzmvseomzyjxbhyrum.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3cXptdnNlb216eWp4Ymh5cnVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjA2MDksImV4cCI6MjA5NTc5NjYwOX0.G3JFHm8i-DZL3vIOqo9ljEn_QQVDZQEjXCl_lbc7OaE';

      if (typeof window.supabase === 'undefined') {
        alert('Supabase library failed to load.');
        return;
      }

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      let logs = [], weightMonthChart, calScatterChart;
      let currentUser = null;
      let todayDraft = {};

      function getLocalDateStr(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      let todayStr = getLocalDateStr();

      const loginScreen = document.getElementById('loginScreen');
      const mainApp = document.getElementById('mainApp');
      const loginEmail = document.getElementById('loginEmail');
      const sendMagicLinkBtn = document.getElementById('sendMagicLinkBtn');
      const streakCountSpan = document.getElementById('streakCount');

      // -------- DRAFT HELPERS (FIXED) ---------
      function getDraftKey() {
        // Simplified: always same key for today, regardless of user
        return 'thiccDraft:' + todayStr;
      }

      function saveDraftToStorage(state) {
        try { localStorage.setItem(getDraftKey(), JSON.stringify(state)); }
        catch(e) { console.warn('draft save failed'); }
      }

      function loadDraftFromStorage() {
        try {
          const raw = localStorage.getItem(getDraftKey());
          return raw ? JSON.parse(raw) : null;
        } catch(e) { return null; }
      }

      function clearDraftStorage() {
        try { localStorage.removeItem(getDraftKey()); } catch(e) {}
      }

      function collectTodayState() {
        const checklist = {};
        document.querySelectorAll('.check-item').forEach(item => {
          checklist[item.dataset.key] = item.classList.contains('checked');
        });
        const water = document.querySelectorAll('.cup.filled').length;
        const weight = document.getElementById('weightInput').value;
        const mood = document.querySelector('.mood-btn.active')?.dataset.mood || null;

        const meals = {
          breakfast: { name: document.getElementById('breakfastName').value, kcal: document.getElementById('breakfastKcal').value },
          lunch: { name: document.getElementById('lunchName').value, kcal: document.getElementById('lunchKcal').value },
          dinner: { name: document.getElementById('dinnerName').value, kcal: document.getElementById('dinnerKcal').value }
        };
        const exercise = {
          badminton: document.getElementById('badmintonCals').value,
          walking: document.getElementById('walkingCals').value,
          workout: document.getElementById('workoutCals').value
        };
        return { checklist, water, weight, mood, meals, exercise };
      }

      function applyTodayState(state) {
        if (!state) return;
        document.querySelectorAll('.check-item').forEach(item => {
          item.classList.toggle('checked', !!state.checklist?.[item.dataset.key]);
        });
        const cups = parseInt(state.water,10)||0;
        document.querySelectorAll('.cup').forEach((cup,i)=>cup.classList.toggle('filled', i<cups));
        document.getElementById('waterTotal').textContent = (cups*500)+' / 3500 ml';

        document.getElementById('weightInput').value = state.weight || '';
        document.querySelectorAll('.mood-btn').forEach(btn=>btn.classList.toggle('active', btn.dataset.mood===state.mood));

        document.getElementById('breakfastName').value = state.meals?.breakfast?.name || '';
        document.getElementById('breakfastKcal').value = state.meals?.breakfast?.kcal || '';
        document.getElementById('lunchName').value = state.meals?.lunch?.name || '';
        document.getElementById('lunchKcal').value = state.meals?.lunch?.kcal || '';
        document.getElementById('dinnerName').value = state.meals?.dinner?.name || '';
        document.getElementById('dinnerKcal').value = state.meals?.dinner?.kcal || '';

        document.getElementById('badmintonCals').value = state.exercise?.badminton || '';
        document.getElementById('walkingCals').value = state.exercise?.walking || '';
        document.getElementById('workoutCals').value = state.exercise?.workout || '';

        updateCalorieDisplay();
      }

      function updateCalorieDisplay() {
        const intake = (parseInt(document.getElementById('breakfastKcal').value)||0) +
                       (parseInt(document.getElementById('lunchKcal').value)||0) +
                       (parseInt(document.getElementById('dinnerKcal').value)||0);
        const burn = (parseInt(document.getElementById('badmintonCals').value)||0) +
                     (parseInt(document.getElementById('walkingCals').value)||0) +
                     (parseInt(document.getElementById('workoutCals').value)||0);
        document.getElementById('intakeDisplay').textContent = intake;
        document.getElementById('burnDisplay').textContent = burn;
        document.getElementById('netDisplay').textContent = intake - burn;
      }

      // NEW: combined autosave + calorie refresh (friend's fix #6)
      function autoSaveAndRefreshCalories() {
        persistDraft();
        updateCalorieDisplay();
      }

      function persistDraft() {
        // No user check – always save (friend's fix #1)
        const state = collectTodayState();
        todayDraft = state;
        saveDraftToStorage(state);
      }

      function restoreDraftOrTodayLog() {
        const stored = loadDraftFromStorage();
        if (stored) {
          todayDraft = stored;
          applyTodayState(stored);
          return;
        }
        const today = logs.find(l => l.date === todayStr);
        if (today) {
          applyTodayState({
            checklist: today.checklist || {},
            water: today.waterCups || 0,
            weight: today.weight ?? '',
            mood: today.mood || null,
            meals: today.meals || {},
            exercise: today.exercise || {}
          });
        } else {
          clearTodayInputs();
        }
      }

      function clearTodayInputs() {
        applyTodayState({
          checklist:{}, water:0, weight:'', mood:null,
          meals:{breakfast:{},lunch:{},dinner:{}},
          exercise:{}
        });
      }

      // Wire event listeners – use autoSaveAndRefreshCalories (friend's fix #6)
      function wireAutosaveInputs() {
        const inputs = ['#weightInput','#breakfastName','#breakfastKcal','#lunchName','#lunchKcal',
                        '#dinnerName','#dinnerKcal','#badmintonCals','#walkingCals','#workoutCals'];
        inputs.forEach(sel => {
          const el = document.querySelector(sel);
          if(el) {
            el.addEventListener('input', autoSaveAndRefreshCalories);
            el.addEventListener('change', autoSaveAndRefreshCalories);
          }
        });

        document.querySelectorAll('.check-item').forEach(item => {
          item.addEventListener('click', () => { persistDraft(); });
        });

        document.querySelectorAll('.cup').forEach((cup,i) => {
          cup.addEventListener('click', () => {
            const filled = cup.classList.contains('filled');
            document.querySelectorAll('.cup').forEach((c,j) => {
              if(!filled && j<=i) c.classList.add('filled');
              if(filled && j>=i) c.classList.remove('filled');
            });
            const total = document.querySelectorAll('.cup.filled').length;
            document.getElementById('waterTotal').textContent = (total*500)+' / 3500 ml';
            persistDraft();
          });
        });

        document.querySelectorAll('.mood-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            persistDraft();
          });
        });
      }

      // AUTH
      async function sendMagicLink() {
        const email = loginEmail.value.trim();
        if(!email){ alert('Enter email'); return; }
        try {
          const { error } = await supabase.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: window.location.href }
          });
          if(error){ alert('Error: '+error.message); console.error(error); }
          else { alert('Magic link sent!'); }
        } catch(err){ alert('Network error – use live server'); console.error(err); }
      }
      sendMagicLinkBtn.addEventListener('click', sendMagicLink);

      supabase.auth.onAuthStateChange((event, session) => {
        if(session?.user){
          currentUser = session.user;
          loginScreen.classList.add('hidden');
          mainApp.classList.add('visible');
          todayStr = getLocalDateStr();
          fetchLogs();
        } else {
          currentUser = null;
          loginScreen.classList.remove('hidden');
          mainApp.classList.remove('visible');
          logs = [];
          clearTodayInputs();
          updateAllUI();
        }
      });

      async function fetchLogs() {
        if(!currentUser) return;
        const { data, error } = await supabase
          .from('logs')
          .select('*')
          .eq('user_id', currentUser.id)
          .order('date', { ascending: false });
        if(!error){
          logs = data || [];
          // Restore draft if exists, otherwise show today's log
          const storedDraft = loadDraftFromStorage();
          if(storedDraft){
            applyTodayState(storedDraft);
          } else {
            const today = logs.find(l=>l.date===todayStr);
            if(today){
              applyTodayState({
                checklist: today.checklist || {},
                water: today.waterCups || 0,
                weight: today.weight ?? '',
                mood: today.mood || null,
                meals: today.meals || {},
                exercise: today.exercise || {}
              });
            } else { clearTodayInputs(); }
          }
          updateAllUI();
        } else { console.error('Fetch error', error); }
      }

      // Tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cur = document.querySelector('.tab-btn.active');
          if(cur && cur.dataset.tab==='today') persistDraft();

          document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
          document.getElementById(btn.dataset.tab+'Tab').classList.add('active');

          if(btn.dataset.tab==='today'){ restoreDraftOrTodayLog(); }
          if(btn.dataset.tab==='trends'){ updateCharts(); }
        });
      });

      // Saving
      function saveEntry() {
        if(!currentUser){ alert('Sign in first'); return; }
        const checklist={};
        document.querySelectorAll('.check-item').forEach(item=>checklist[item.dataset.key]=item.classList.contains('checked'));
        const water = document.querySelectorAll('.cup.filled').length;
        const weight = parseFloat(document.getElementById('weightInput').value) || null;
        const mood = document.querySelector('.mood-btn.active')?.dataset.mood || null;
        const meals = {
          breakfast: { name: document.getElementById('breakfastName').value.trim(), kcal: parseInt(document.getElementById('breakfastKcal').value)||0 },
          lunch: { name: document.getElementById('lunchName').value.trim(), kcal: parseInt(document.getElementById('lunchKcal').value)||0 },
          dinner: { name: document.getElementById('dinnerName').value.trim(), kcal: parseInt(document.getElementById('dinnerKcal').value)||0 }
        };
        const exercise = {
          badminton: parseFloat(document.getElementById('badmintonCals').value)||0,
          walking: parseFloat(document.getElementById('walkingCals').value)||0,
          workout: parseFloat(document.getElementById('workoutCals').value)||0
        };
        const entry = { date: todayStr, checklist, waterCups: water, weight, mood, meals, exercise };
        saveLogToSupabase(entry);
      }
      async function saveLogToSupabase(entry){
        entry.user_id = currentUser.id;
        const { error } = await supabase.from('logs').upsert(entry, { onConflict: 'date, user_id' });
        if(!error){
          const toast = document.getElementById('toast');
          toast.classList.add('show');
          setTimeout(()=>toast.classList.remove('show'),2000);
          clearDraftStorage();
          todayDraft = {};
          fetchLogs();
        } else { console.error('Save error', error); alert('Save failed'); }
      }
      document.getElementById('saveBtn').addEventListener('click', saveEntry);

      // Stats, charts (unchanged)
      function updateAllUI() {
        if(currentUser) streakCountSpan.textContent = calculateStreak();
        const wLogs = logs.filter(l=>l.weight&&!isNaN(l.weight)).sort((a,b)=>b.date.localeCompare(a.date));
        document.getElementById('currentWeightDisplay').textContent = wLogs[0]?.weight?.toFixed(1)+' kg' || '--';
        document.getElementById('kgLostDisplay').textContent = wLogs[0]?.weight ? Math.max(0,114.2-wLogs[0].weight).toFixed(1) : '0';
        document.getElementById('daysLoggedDisplay').textContent = new Set(logs.map(l=>l.date)).size;
        const avg = calcAvgKgWeek();
        document.getElementById('avgKgWeekDisplay').textContent = avg!==null ? avg.toFixed(1) : '--';
        renderHistoryTable();
        if(currentUser) updateCharts();
      }
      function calculateStreak(){ /* ... same as before ... */ }
      function calcAvgKgWeek(){ /* ... same as before ... */ }
      function formatDateDDMMYY(d){ const p=d.split('-'); return `${p[2]}/${p[1]}/${p[0].slice(-2)}`; }
      function renderHistoryTable(){ /* ... same as before ... */ }
      function updateCharts(){ /* ... same as before ... */ }

      // ---------- FRIEND'S ADDITIONAL FIXES ----------
      // Fix #3: Restore draft immediately on page load
      const startupDraft = loadDraftFromStorage();
      if (startupDraft) {
        applyTodayState(startupDraft);
      }

      // Fix #4: Auto-save every second
      setInterval(() => {
        persistDraft();
      }, 1000);

      // Fix #5: Save when tab loses focus (mobile/Chrome)
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          persistDraft();
        }
      });

      window.addEventListener('beforeunload', persistDraft);
      // End of friend's fixes

      wireAutosaveInputs();

      supabase.auth.getSession().then(({data:{session}}) => {
        if(!session){ loginScreen.classList.remove('hidden'); }
      });
    })();
  </script>
</body>
</html>
