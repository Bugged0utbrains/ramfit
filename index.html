      display: flex;
      justify-content: center;

      min-height: 100vh;

    /* Login screen */
    .login-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      background: var(--bg);
      backdrop-filter: blur(10px);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .login-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .login-card {
      background: var(--glass-bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 32px;
      padding: 48px 32px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      animation: floatUp 0.8s ease;
    }
    @keyframes floatUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .login-logo {
      font-weight: 800;
      font-size: 3rem;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #34c759, #30b0c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .login-peach {
      font-size: 3.5rem;
      display: block;
      animation: floatPeach 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255,140,0,0.6));
      margin-bottom: 8px;
    }
    @keyframes floatPeach {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .login-subtitle {
      color: var(--text2);
      font-size: 0.95rem;
      margin-bottom: 32px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .email-input {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      padding: 16px 24px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      text-align: center;
      margin-bottom: 16px;
    }
    .email-input:focus { border-color: var(--accent); }
    .magic-btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 16px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 10px 30px rgba(52,199,89,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .magic-btn:active { transform: scale(0.96); }

    /* Main app */
    .app {
      max-width: 600px;
      width: 100%;
      padding-top: var(--header-height);
      display: none;
      padding-bottom: 40px;
    }
    .app.visible { display: block; }
